name: Laboratorio Windows sin instalador
on:
  push:
    branches: ['laboratorio/pruebas-sin-instalador']
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Preparar servidor solo para pruebas
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de dependencias.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Falló el análisis de tipos del servidor.' }
      - name: Pruebas aisladas de selección, TLS y exclusión
        working-directory: server
        run: |
          foreach ($test in @('seleccion-base','laboratorio-tls-red','control-tls','exclusion-datos','dbconfig-sqlite','nombre-red')) {
            node --no-warnings "test/$test.mjs"
            if ($LASTEXITCODE -ne 0) { throw "Falló la prueba $test." }
          }
      - name: Comprobar DLL redistribuibles sin construir instalador
        shell: pwsh
        run: |
          & './escritorio/windows/prueba_runtime.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Falló la comprobación del runtime local.' }
      - name: Dependencias para navegador de prueba
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de dependencias del navegador.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Chromium.' }
      - name: HTTPS con Chromium y CA temporal solo en VM de CI
        working-directory: client
        env:
          SGF_TEST_WINDOWS_CA: '1'
        run: node --no-warnings test/laboratorio-tls-windows.mjs
      - name: Dependencias Flutter
        working-directory: escritorio
        run: flutter pub get
      - name: Analizar y probar sin construir aplicación ni instalador
        working-directory: escritorio
        env:
          SGF_SERVER_TEST_DIR: ${{ github.workspace }}\server
          SGF_NODE_TEST: node
          SGF_GUARD_TEST_SCRIPT: ${{ github.workspace }}\server\dist\utils\guardia-bloqueo.js
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'Falló el análisis de Flutter.' }
          flutter test --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de Flutter.' }
