name: Compilar e instalar SGF (Windows)

# Se ejecuta al subir cambios a main o a la rama de trabajo, y a mano desde la
# pestaña Actions. Genera:
#   - SGF-Escritorio-Setup-<version>.exe   (instalador con TODO dentro)
#   - SGF-Escritorio-Portable-<version>.zip (carpeta que arranca sin instalar)
#   - resultados de pruebas e informes

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej. 4.0.0)'
        required: false
        default: '4.0.0'

env:
  VERSION: ${{ github.event.inputs.version || '4.0.0' }}

# Permiso para publicar la Release con el .exe dentro.
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Comprobaciones rapidas: tipos del servidor, pruebas de la API y del
  #    analisis de PDF. Si algo falla, no se compila nada.
  # ───────────────────────────────────────────────────────────────────────────
  servidor:
    name: Servidor · tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm rebuild oracledb --build-from-source || true

      - name: Comprobar TypeScript
        working-directory: server
        run: npx tsc --noEmit

      - name: Compilar servidor
        working-directory: server
        run: npx tsc

      - name: Arrancar servidor de pruebas
        working-directory: server
        env:
          DB_TYPE: sqlite
          PORT: '3000'
          HOST: '127.0.0.1'
          JWT_SECRET: secreto-solo-para-pruebas-123456
          SGF_DATA_DIR: ${{ github.workspace }}/datos-prueba
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
        run: |
          mkdir -p "$SGF_DATA_DIR"
          node dist/index.js > servidor.log 2>&1 &
          echo $! > servidor.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then echo "Servidor arriba"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Pruebas de seguridad (rutas cerradas)
        run: |
          set -e
          echo "1) /api/facturas sin sesion debe dar 401"
          codigo_fact=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/facturas)
          echo "   facturas=$codigo_fact"
          test "$codigo_fact" = "401"

          echo "2) La cuenta inicial se crea por la ruta de configuracion (sin sesion)"
          # La base arranca SIN usuarios: igual que en la app, la cuenta se crea
          # desde /api/setup/admin. Mientras este vacia, el asistente puede
          # configurar la BD; en cuanto hay una cuenta, la ventana se cierra.
          TOKEN=$(curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","name":"Administrador","password":"para-pruebas-123"}' \
            http://127.0.0.1:3000/api/setup/admin | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          test -n "$TOKEN"

          echo "3) Con la instalacion ya configurada, /api/db/test exige credenciales"
          codigo_test=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'x-install-token: token-incorrecto' \
            -d '{"type":"oracle","host":"x","port":"1","service":"x","user":"x","password":"x"}' \
            http://127.0.0.1:3000/api/db/test)
          echo "   db/test=$codigo_test"
          test "$codigo_test" = "403"

          echo "4) Un segundo usuario: /api/db/config sin credenciales sigue cerrado"
          curl -s -o /dev/null -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"operador_ci","password":"Operador-123!","name":"Operador CI","role":"usuario"}' \
            http://127.0.0.1:3000/api/users
          codigo_db=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-sgf-console-token: token-incorrecto' http://127.0.0.1:3000/api/db/config)
          echo "   db/config=$codigo_db"
          test "$codigo_db" = "403"

          echo "5) Y con la sesion del administrador si responde"
          codigo_admin=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3000/api/db/config)
          echo "   db/config con admin=$codigo_admin"
          test "$codigo_admin" = "200"
          echo "Comprobaciones de seguridad correctas."

      - name: Panel de la consola responde
        env:
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
        run: |
          curl -fsS -H "x-sgf-console-token: $SGF_CONSOLE_TOKEN" http://127.0.0.1:3000/api/panel/estado | tee panel.json
          grep -q '"contadores"' panel.json

      - name: Guardar registro del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-servidor
          path: |
            server/servidor.log
            panel.json
          if-no-files-found: ignore

      - name: Parar servidor
        if: always()
        run: kill "$(cat servidor.pid)" 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Aplicacion Flutter: analisis, pruebas y compilacion del .exe
  # ───────────────────────────────────────────────────────────────────────────
  escritorio:
    name: Escritorio · Flutter (Windows)
    needs: [servidor, integracion]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Dependencias
        working-directory: escritorio
        run: flutter pub get

      - name: Analisis estatico (0 errores obligatorio)
        working-directory: escritorio
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas de interfaz
        working-directory: escritorio
        run: flutter test --reporter expanded

      - name: Compilar ejecutable
        working-directory: escritorio
        run: flutter build windows --release --build-name=${{ env.VERSION }} --dart-define=SGF_VERSION=${{ env.VERSION }}

      # ── Montaje del paquete: .exe + servidor + Node + dependencias ─────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Node portatil
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node).Source
          $nodeDir = Join-Path $env:RUNNER_TEMP 'node-portatil'
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          Copy-Item $nodeExe (Join-Path $nodeDir 'node.exe')
          Write-Host "Node copiado desde $nodeExe"

      # Se instalan TODAS las dependencias porque el .js compilado se genera aqui
      # (necesita typescript). Las de desarrollo se quitan despues, antes de
      # empaquetar, para que el instalador no las lleve.
      - name: Preparar el servidor
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npx tsc
          npm prune --omit=dev --no-audit --no-fund

      - name: Compilar la versión web sin conexión
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Montar la carpeta de distribucion
        shell: pwsh
        run: |
          $destino = 'distribucion'
          Remove-Item -Recurse -Force $destino -ErrorAction Ignore
          New-Item -ItemType Directory -Force -Path $destino | Out-Null

          # 1) La aplicacion Flutter
          Copy-Item -Recurse 'escritorio/build/windows/x64/runner/Release/*' $destino

          # 2) El servidor Node, con su node_modules de produccion
          $servidor = Join-Path $destino 'servidor'
          New-Item -ItemType Directory -Force -Path $servidor | Out-Null
          Copy-Item -Recurse 'server/dist' (Join-Path $servidor 'dist')
          Copy-Item 'server/package.json' $servidor
          Copy-Item -Recurse 'server/node_modules' (Join-Path $servidor 'node_modules')
          # Comprobacion: el instalador no debe llevar HERRAMIENTAS de desarrollo.
          # Ojo: @types/node SI debe ir, porque mssql -> tedious -> bl la necesitan
          # en produccion (son solo declaraciones de tipos, pesan poco).
          $devSobra = Get-ChildItem (Join-Path $servidor 'node_modules') -Directory |
            Where-Object { $_.Name -in @('typescript','vite','tailwindcss','@vitejs','terser') }
          $devSobra += Get-ChildItem (Join-Path $servidor 'node_modules/@types') -Directory -ErrorAction Ignore |
            Where-Object { $_.Name -in @('express','cors','jsonwebtoken') }
          if ($devSobra) {
            Write-Error "Hay herramientas de desarrollo en el paquete: $($devSobra.Name -join ', ')"
            exit 1
          }
          if (Test-Path (Join-Path $servidor 'node_modules/typescript')) {
            Write-Error "typescript no deberia estar en el paquete (solo se necesita para compilar)"
            exit 1
          }
          Write-Host "node_modules de produccion: $((Get-ChildItem (Join-Path $servidor 'node_modules') -Directory).Count) paquetes"
          $runtime = Join-Path $servidor 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'node-portatil/node.exe') $runtime

          # La ruta esperada por servidor/dist/index.js es ../../client/dist.
          New-Item -ItemType Directory -Force -Path (Join-Path $destino 'client') | Out-Null
          Copy-Item -Recurse 'client/dist' (Join-Path $destino 'client/dist')

          # 3) Material de apoyo
          Copy-Item 'escritorio/LEEME-PRIMERO.txt' $destino -ErrorAction Ignore
          Get-ChildItem $destino | Select-Object Name, Length

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Comprobar que el paquete esta completo
        shell: pwsh
        run: |
          # El instalador exige estos tres archivos; si falta alguno, mejor saberlo
          # aqui que en el equipo del usuario.
          $obligatorios = @(
            'distribucion\sgf_escritorio.exe',
            'distribucion\servidor\runtime\node.exe',
            'distribucion\servidor\dist\index.js',
            'distribucion\client\dist\index.html',
            'distribucion\LEEME-PRIMERO.txt'
          )
          $faltan = $obligatorios | Where-Object { -not (Test-Path $_) }
          if ($faltan) { Write-Error "Faltan en el paquete: $($faltan -join ', ')"; exit 1 }
          Write-Host "Paquete completo. Tamaño: $([math]::Round((Get-ChildItem distribucion -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: Probar web y consola del paquete montado
        shell: pwsh
        run: |
          $env:DB_TYPE = 'sqlite'
          $env:PORT = '35119'
          $env:HOST = '127.0.0.1'
          $env:JWT_SECRET = 'secreto-solo-para-pruebas-123456'
          $env:SGF_CONSOLE_TOKEN = 'token-consola-ci-1234567890'
          $env:SGF_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sgf-prueba-paquete'
          New-Item -ItemType Directory -Force -Path $env:SGF_DATA_DIR | Out-Null
          $node = (Resolve-Path 'distribucion/servidor/runtime/node.exe').Path
          $js = (Resolve-Path 'distribucion/servidor/dist/index.js').Path
          $proceso = Start-Process -FilePath $node -ArgumentList @("`"$js`"") -WorkingDirectory (Resolve-Path 'distribucion/servidor').Path -PassThru -NoNewWindow
          try {
            $listo = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { $ping = Invoke-RestMethod 'http://127.0.0.1:35119/api/panel/ping'; if ($ping.data.pid -eq $proceso.Id) { $listo = $true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $listo) { throw 'El servidor incluido no arrancó o el puerto está ocupado.' }
            $panel = Invoke-RestMethod 'http://127.0.0.1:35119/api/panel/estado' -Headers @{ 'x-sgf-console-token' = $env:SGF_CONSOLE_TOKEN }
            if (-not $panel.success) { throw 'El token de consola del paquete no funciona.' }
            $web = Invoke-WebRequest 'http://127.0.0.1:35119/' -UseBasicParsing
            if ($web.StatusCode -ne 200 -or $web.Content -notmatch '<div id="root">') { throw 'No se puede abrir la versión web incluida.' }
            $asset = [regex]::Match($web.Content, 'src="(/assets/[^" ]+\.js)"').Groups[1].Value
            if (-not $asset) { throw 'Falta el JavaScript de la versión web.' }
            $jsWeb = Invoke-WebRequest "http://127.0.0.1:35119$asset" -UseBasicParsing
            if ($jsWeb.StatusCode -ne 200) { throw 'No se puede abrir el JavaScript incluido.' }
            Write-Host 'Web, recursos y token de consola del paquete: OK.'
          } finally {
            if (-not $proceso.HasExited) { Stop-Process -Id $proceso.Id -Force }
          }

      - name: Generar instalador
        shell: pwsh
        run: |
          $iss = 'instalador/sgf.iss'
          (Get-Content $iss) -replace '@VERSION@', '${{ env.VERSION }}' | Set-Content $iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup fallo (codigo $LASTEXITCODE)"; exit 1 }
          Get-ChildItem 'instalador/*.exe' | Select-Object Name, Length

      - name: Comprimir version portable
        shell: pwsh
        run: |
          Compress-Archive -Path 'distribucion/*' -DestinationPath "SGF-Escritorio-Portable-${{ env.VERSION }}.zip" -Force

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: SGF-Escritorio-${{ env.VERSION }}
          path: |
            instalador/SGF-Escritorio-Setup-*.exe
            SGF-Escritorio-Portable-*.zip
          if-no-files-found: error

      # ── Release automática ────────────────────────────────────────────────
      # Antes el .exe solo quedaba como "artifact" de la ejecución (hay que estar
      # registrado para descargarlo y caduca). Ahora cada compilación correcta
      # publica una Release con el instalador dentro, que es lo que se descarga
      # desde la página del repositorio.
      - name: Publicar la Release con el instalador
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $etiqueta = "v${{ env.VERSION }}"
          $instalador = (Get-ChildItem 'instalador/SGF-Escritorio-Setup-*.exe' | Select-Object -First 1).FullName
          $portable = (Get-ChildItem 'SGF-Escritorio-Portable-*.zip' | Select-Object -First 1).FullName
          if (-not $instalador) { Write-Error "No se genero el instalador"; exit 1 }

          $notas = @"
          ## SGF Escritorio v${{ env.VERSION }}

          Aplicacion instalable para Windows. **No hace falta instalar Node ni nada mas**: el instalador trae todo dentro.

          - ``SGF-Escritorio-Setup-${{ env.VERSION }}.exe`` — instalador (recomendado). Se instala, se abre y arranca el servidor solo.
          - ``SGF-Escritorio-Portable-${{ env.VERSION }}.zip`` — para probar sin instalar: descomprimir y ejecutar ``sgf_escritorio.exe``.

          Al abrir por primera vez, un asistente guia los pasos para crear su propia cuenta de administrador. No hay una cuenta de fabrica.
          "@
          $notas | Set-Content -Path notas-release.md -Encoding utf8

          # Si la etiqueta ya existe se actualizan los archivos; si no, se crea.
          gh release view $etiqueta --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La release $etiqueta ya existe: se actualizan los archivos."
            gh release upload $etiqueta $instalador $portable --clobber --repo ${{ github.repository }}
          } else {
            gh release create $etiqueta $instalador $portable `
              --repo ${{ github.repository }} `
              --title "SGF Escritorio v${{ env.VERSION }}" `
              --notes-file notas-release.md
          }
          Write-Host "Release publicada: $etiqueta"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Pruebas de integracion: la app Flutter habla con el servidor real
  # ───────────────────────────────────────────────────────────────────────────
  integracion:
    name: Integracion · Flutter + servidor
    needs: servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Preparar servidor
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npx tsc
          mkdir -p "$GITHUB_WORKSPACE/datos-ci"
          DB_TYPE=sqlite PORT=3000 HOST=127.0.0.1 \
          JWT_SECRET=secreto-ci-1234567890 \
          SGF_DATA_DIR="$GITHUB_WORKSPACE/datos-ci" \
          SGF_CONSOLE_TOKEN=token-consola-ci-1234567890 \
          node dist/index.js > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Dependencias Flutter
        working-directory: escritorio
        run: flutter pub get

      - name: Pruebas de integracion
        working-directory: escritorio
        env:
          SGF_INTEGRACION: '1'
          SGF_BASE: http://127.0.0.1:3000
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
          SGF_CLAVE_PRUEBAS: para-pruebas-123
        run: flutter test test_integracion/api_test.dart --reporter expanded

      - name: Registro si algo falla
        if: failure()
        run: cat server/servidor.log || true
