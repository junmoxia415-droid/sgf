name: Compilar e instalar SGF (Windows)

# Se ejecuta al subir cambios a main o a la rama de trabajo, y a mano desde la
# pestaña Actions. Genera:
#   - SGF-Escritorio-Setup-<version>.exe   (instalador con TODO dentro)
#   - SGF-Escritorio-Portable-<version>.zip (carpeta que arranca sin instalar)
#   - resultados de pruebas e informes

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej. 4.0.10)'
        required: false
        default: '4.0.10'

env:
  VERSION: ${{ github.event.inputs.version || '4.0.10' }}

# Permiso para publicar la Release con el .exe dentro.
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Comprobaciones rapidas: tipos del servidor, pruebas de la API y del
  #    analisis de PDF. Si algo falla, no se compila nada.
  # ───────────────────────────────────────────────────────────────────────────
  servidor:
    name: Servidor · tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm rebuild oracledb --build-from-source || true

      - name: Comprobar TypeScript
        working-directory: server
        run: npx tsc --noEmit

      - name: Compilar servidor
        working-directory: server
        run: npx tsc

      - name: Seguridad de red y permisos (SQLite ficticio)
        working-directory: server
        run: |
          python3 test/red-y-permisos.py
          node test/migracion-permisos.mjs
          node test/nombre-red.mjs
          node test/nombre-corto.mjs
          node test/nombre-corto-mdns-local.mjs
          node test/certificado-anterior-nombre-corto.mjs
          node test/redes-autorizadas.mjs
          node test/enlace-seguro.mjs
          node test/aislamiento-prueba.mjs
          node test/red-institucional.mjs
          node test/exclusion-datos.mjs
          node test/guardado-fallido.mjs
          node test/excel-columnas-vacias.mjs
          node test/control-tls.mjs
          node test/pdf-guardado.mjs
          node test/pdf-variados-api.mjs
          node test/transacciones.mjs
          node test/dbconfig-sqlite.mjs
          npx tsx src/scripts/prueba-pdf-layout.ts

      - name: Preparar web para la prueba de acceso directo
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Probar transferencia web comprimida
        working-directory: server
        run: node --no-warnings test/estaticos-rapidos.mjs

      - name: Probar clientes en redes ficticias diferentes
        working-directory: server
        run: |
          set -e
          sudo ip addr add 203.0.113.50/32 dev lo
          sudo ip addr add 198.51.100.51/32 dev lo
          trap 'sudo ip addr del 203.0.113.50/32 dev lo || true; sudo ip addr del 198.51.100.51/32 dev lo || true' EXIT
          SGF_RED_CLIENTE_PRUEBA=203.0.113.50 SGF_RED_OTRA_PRUEBA=198.51.100.51 node --no-warnings test/acceso-sin-red-real.mjs

      - name: Arrancar servidor de pruebas
        working-directory: server
        env:
          DB_TYPE: sqlite
          PORT: '3000'
          HOST: '127.0.0.1'
          JWT_SECRET: secreto-solo-para-pruebas-123456
          SGF_DATA_DIR: ${{ github.workspace }}/datos-prueba
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
        run: |
          mkdir -p "$SGF_DATA_DIR"
          node dist/index.js > servidor.log 2>&1 &
          echo $! > servidor.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then echo "Servidor arriba"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Pruebas de seguridad (rutas cerradas)
        run: |
          set -e
          echo "1) /api/facturas sin sesion debe dar 401"
          codigo_fact=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/facturas)
          echo "   facturas=$codigo_fact"
          test "$codigo_fact" = "401"

          echo "2) La cuenta inicial se crea por la ruta de configuracion (sin sesion)"
          # La base arranca SIN usuarios: igual que en la app, la cuenta se crea
          # desde /api/setup/admin. Mientras este vacia, el asistente puede
          # configurar la BD; en cuanto hay una cuenta, la ventana se cierra.
          TOKEN=$(curl -s -X POST -H 'Content-Type: application/json' -H 'x-sgf-console-token: token-consola-ci-1234567890' \
            -d '{"username":"admin","name":"Administrador","password":"para-pruebas-123"}' \
            http://127.0.0.1:3000/api/setup/admin | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          test -n "$TOKEN"

          echo "3) Con la instalacion ya configurada, /api/db/test exige credenciales"
          codigo_test=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'x-install-token: token-incorrecto' \
            -d '{"type":"oracle","host":"x","port":"1","service":"x","user":"x","password":"x"}' \
            http://127.0.0.1:3000/api/db/test)
          echo "   db/test=$codigo_test"
          test "$codigo_test" = "403"

          echo "4) Un segundo usuario: /api/db/config sin credenciales sigue cerrado"
          curl -s -o /dev/null -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"operador_ci","password":"Operador-123!","name":"Operador CI","role":"usuario"}' \
            http://127.0.0.1:3000/api/users
          codigo_db=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-sgf-console-token: token-incorrecto' http://127.0.0.1:3000/api/db/config)
          echo "   db/config=$codigo_db"
          test "$codigo_db" = "403"

          echo "5) Y con la sesion del administrador si responde"
          codigo_admin=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3000/api/db/config)
          echo "   db/config con admin=$codigo_admin"
          test "$codigo_admin" = "200"
          echo "Comprobaciones de seguridad correctas."

      - name: Panel de la consola responde
        env:
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
        run: |
          curl -fsS -H "x-sgf-console-token: $SGF_CONSOLE_TOKEN" http://127.0.0.1:3000/api/panel/estado | tee panel.json
          grep -q '"contadores"' panel.json

      - name: Guardar registro del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-servidor
          path: |
            server/servidor.log
            panel.json
          if-no-files-found: ignore

      - name: Parar servidor
        if: always()
        run: kill "$(cat servidor.pid)" 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Aplicacion Flutter: analisis, pruebas y compilacion del .exe
  # ───────────────────────────────────────────────────────────────────────────
  escritorio:
    name: Escritorio · Flutter (Windows)
    needs: [servidor, integracion, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar servidor para las pruebas de protección de datos
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npx tsc
          node --no-warnings test/exclusion-datos.mjs
          node --no-warnings test/guardado-fallido.mjs
          node --no-warnings test/control-tls.mjs

      - name: Dependencias
        working-directory: escritorio
        run: flutter pub get

      - name: Analisis estatico (0 errores obligatorio)
        working-directory: escritorio
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas de interfaz
        working-directory: escritorio
        env:
          SGF_GUARD_TEST_SCRIPT: ${{ github.workspace }}\server\dist\utils\guardia-bloqueo.js
          SGF_SERVER_TEST_DIR: ${{ github.workspace }}\server
          SGF_NODE_TEST: node
        run: flutter test --reporter expanded

      - name: Verificar aislamiento de la edición de prueba
        working-directory: escritorio
        run: flutter test --dart-define=SGF_PRUEBA_AISLADA=true test/aislamiento_prueba_test.dart test/instalacion_nueva_https_test.dart --reporter expanded

      - name: Compilar ejecutable
        working-directory: escritorio
        run: flutter build windows --release --build-name=${{ env.VERSION }} --dart-define=SGF_VERSION=${{ env.VERSION }}

      # ── Montaje del paquete: .exe + servidor + Node + dependencias ─────────
      - name: Preparar Node portatil
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node).Source
          $nodeDir = Join-Path $env:RUNNER_TEMP 'node-portatil'
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          Copy-Item $nodeExe (Join-Path $nodeDir 'node.exe')
          Write-Host "Node copiado desde $nodeExe"

      # Se instalan TODAS las dependencias porque el .js compilado se genera aqui
      # (necesita typescript). Las de desarrollo se quitan despues, antes de
      # empaquetar, para que el instalador no las lleve.
      - name: Preparar el servidor
        working-directory: server
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Compilar la versión web sin conexión
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Montar la carpeta de distribucion
        shell: pwsh
        run: |
          $destino = 'distribucion'
          Remove-Item -Recurse -Force $destino -ErrorAction Ignore
          New-Item -ItemType Directory -Force -Path $destino | Out-Null

          # 1) La aplicacion Flutter
          Copy-Item -Recurse 'escritorio/build/windows/x64/runner/Release/*' $destino

          # 2) El servidor Node, con su node_modules de produccion
          $servidor = Join-Path $destino 'servidor'
          New-Item -ItemType Directory -Force -Path $servidor | Out-Null
          Copy-Item -Recurse 'server/dist' (Join-Path $servidor 'dist')
          Copy-Item 'server/package.json' $servidor
          Copy-Item -Recurse 'server/node_modules' (Join-Path $servidor 'node_modules')
          # Comprobacion: el instalador no debe llevar HERRAMIENTAS de desarrollo.
          # Ojo: @types/node SI debe ir, porque mssql -> tedious -> bl la necesitan
          # en produccion (son solo declaraciones de tipos, pesan poco).
          $devSobra = Get-ChildItem (Join-Path $servidor 'node_modules') -Directory |
            Where-Object { $_.Name -in @('typescript','vite','tailwindcss','@vitejs','terser') }
          $devSobra += Get-ChildItem (Join-Path $servidor 'node_modules/@types') -Directory -ErrorAction Ignore |
            Where-Object { $_.Name -in @('express','cors','jsonwebtoken') }
          if ($devSobra) {
            Write-Error "Hay herramientas de desarrollo en el paquete: $($devSobra.Name -join ', ')"
            exit 1
          }
          if (Test-Path (Join-Path $servidor 'node_modules/typescript')) {
            Write-Error "typescript no deberia estar en el paquete (solo se necesita para compilar)"
            exit 1
          }
          Write-Host "node_modules de produccion: $((Get-ChildItem (Join-Path $servidor 'node_modules') -Directory).Count) paquetes"
          $runtime = Join-Path $servidor 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'node-portatil/node.exe') $runtime

          # Runtime Microsoft x64 oficial, junto a ambos ejecutables: funciona
          # también sin VC++ instalado globalmente y no altera el sistema.
          & './escritorio/windows/copiar_runtime.ps1' -Destino $destino -DestinoNode $runtime

          # La ruta esperada por servidor/dist/index.js es ../../client/dist.
          New-Item -ItemType Directory -Force -Path (Join-Path $destino 'client') | Out-Null
          Copy-Item -Recurse 'client/dist' (Join-Path $destino 'client/dist')

          # 3) Material de apoyo
          Copy-Item 'escritorio/LEEME-PRIMERO.txt' (Join-Path $destino 'LEEME-PRIMERO.txt')
          $servicio = Join-Path $destino 'servicio'
          New-Item -ItemType Directory -Force -Path $servicio | Out-Null
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $salidaServicio = Join-Path $servicio 'sgf_servicio.exe'
          $codigoServicio = (Resolve-Path 'escritorio/windows/servicio/ServicioSgf.cs').Path
          & $csc /nologo /target:exe /reference:System.ServiceProcess.dll "/out:$salidaServicio" $codigoServicio
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar el servicio de SGF.' }
          Copy-Item 'escritorio/windows/servicio/gestionar.ps1' $servicio
          Get-ChildItem $destino | Select-Object Name, Length

      - name: Probar TLS con Node y dependencias del paquete
        working-directory: distribucion/servidor
        shell: pwsh
        run: |
          & '.\runtime\node.exe' --no-warnings '..\..\server\test\control-tls.mjs'
          if ($LASTEXITCODE -ne 0) { throw 'La prueba TLS del paquete falló.' }

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Comprobar que el paquete esta completo
        shell: pwsh
        run: |
          # El instalador exige estos tres archivos; si falta alguno, mejor saberlo
          # aqui que en el equipo del usuario.
          $obligatorios = @(
            'distribucion\sgf_escritorio.exe',
            'distribucion\msvcp140.dll',
            'distribucion\vcruntime140.dll',
            'distribucion\vcruntime140_1.dll',
            'distribucion\servidor\runtime\node.exe',
            'distribucion\servidor\runtime\vcruntime140.dll',
            'distribucion\servidor\runtime\vcruntime140_1.dll',
            'distribucion\servidor\dist\index.js',
            'distribucion\servidor\dist\utils\guardia-bloqueo.js',
            'distribucion\servidor\dist\utils\control-tls.js',
            'distribucion\servidor\dist\scripts\supervisor-servicio.js',
            'distribucion\servidor\dist\scripts\red-protegida.js',
            'distribucion\servidor\dist\scripts\redes-autorizadas.js',
            'distribucion\servicio\sgf_servicio.exe',
            'distribucion\servicio\gestionar.ps1',
            'distribucion\client\dist\index.html',
            'distribucion\LEEME-PRIMERO.txt'
          )
          $faltan = $obligatorios | Where-Object { -not (Test-Path $_) }
          if ($faltan) { Write-Error "Faltan en el paquete: $($faltan -join ', ')"; exit 1 }
          Write-Host "Paquete completo. Tamaño: $([math]::Round((Get-ChildItem distribucion -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: Probar web y consola del paquete montado
        shell: pwsh
        run: |
          $env:DB_TYPE = 'sqlite'
          $env:PORT = '35119'
          $env:HOST = '127.0.0.1'
          $env:JWT_SECRET = 'secreto-solo-para-pruebas-123456'
          $env:SGF_CONSOLE_TOKEN = 'token-consola-ci-1234567890'
          $env:SGF_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sgf-prueba-paquete'
          New-Item -ItemType Directory -Force -Path $env:SGF_DATA_DIR | Out-Null
          $node = (Resolve-Path 'distribucion/servidor/runtime/node.exe').Path
          $js = (Resolve-Path 'distribucion/servidor/dist/index.js').Path
          $proceso = Start-Process -FilePath $node -ArgumentList @("`"$js`"") -WorkingDirectory (Resolve-Path 'distribucion/servidor').Path -PassThru -NoNewWindow
          try {
            $listo = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { $ping = Invoke-RestMethod 'http://127.0.0.1:35119/api/panel/ping'; if ($ping.data.pid -eq $proceso.Id) { $listo = $true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $listo) { throw 'El servidor incluido no arrancó o el puerto está ocupado.' }
            $panel = Invoke-RestMethod 'http://127.0.0.1:35119/api/panel/estado' -Headers @{ 'x-sgf-console-token' = $env:SGF_CONSOLE_TOKEN }
            if (-not $panel.success) { throw 'El token de consola del paquete no funciona.' }
            $web = Invoke-WebRequest 'http://127.0.0.1:35119/' -UseBasicParsing
          if ($web.StatusCode -ne 200 -or $web.Content -notmatch '/seleccionar-version.js') { throw 'Falta el selector de versión web.' }
          $selector = Invoke-WebRequest 'http://127.0.0.1:35119/seleccionar-version.js' -UseBasicParsing
          if ($selector.StatusCode -ne 200 -or $selector.Content -notmatch 'destino') { throw 'No se puede cargar el selector web.' }
          foreach ($versionWeb in @('moderna', 'compat')) {
            $pagina = Invoke-WebRequest "http://127.0.0.1:35119/$versionWeb/index.html" -UseBasicParsing
            if ($pagina.StatusCode -ne 200 -or $pagina.Content -notmatch '<div id="root">') { throw "Falta la interfaz $versionWeb." }
            $asset = [regex]::Match($pagina.Content, "src=`"(/$versionWeb/assets/[^`" ]+\.js)`"").Groups[1].Value
            if (-not $asset) { throw "Falta el JavaScript de la interfaz $versionWeb." }
            $jsWeb = Invoke-WebRequest "http://127.0.0.1:35119$asset" -UseBasicParsing
            if ($jsWeb.StatusCode -ne 200) { throw "No se puede abrir el JavaScript $versionWeb." }
          }
          Write-Host 'Selector, ambas interfaces, recursos y token de consola del paquete: OK.'
          } finally {
            if (-not $proceso.HasExited) { Stop-Process -Id $proceso.Id -Force }
          }

      - name: Generar instalador
        shell: pwsh
        run: |
          $iss = 'instalador/sgf.iss'
          if ('${{ env.VERSION }}' -ne '4.0.10') { throw 'Esta configuración corresponde únicamente a la versión 4.0.10.' }
          (Get-Content $iss) -replace '@VERSION@', '${{ env.VERSION }}' | Set-Content $iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup fallo (codigo $LASTEXITCODE)"; exit 1 }
          Get-ChildItem 'instalador/*.exe' | Select-Object Name, Length

      - name: Probar actualización de SGF 4.0.9 con datos ficticios
        shell: pwsh
        run: |
          $antiguo = Join-Path $env:RUNNER_TEMP 'sgf-4.0.9.exe'
          Invoke-WebRequest 'https://github.com/junmoxia415-droid/sgf/releases/download/v4.0.9/SGF-Escritorio-Setup-4.0.9.exe' -OutFile $antiguo
          if ((Get-FileHash -Algorithm SHA256 $antiguo).Hash -ine 'b55b1475eec2f91b24a6abdfa9a86d037812808b3e50b6b5b1d52f98dca1c37d') { throw 'El instalador anterior no coincide con su huella.' }
          $destino = Join-Path $env:RUNNER_TEMP 'SGF-actualizacion'
          $r = Start-Process $antiguo -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destino`" /TASKS=`"`"" -Wait -PassThru
          if ($r.ExitCode -ne 0 -or -not (Test-Path (Join-Path $destino 'sgf_escritorio.exe'))) { throw "No se pudo instalar la versión anterior: $($r.ExitCode)" }
          $datos = Join-Path $env:APPDATA 'SGF/datos'
          New-Item -ItemType Directory -Force -Path $datos | Out-Null
          $testigo = Join-Path $datos 'sgf-data.db'
          Set-Content $testigo 'datos SQLite simulados: no son facturas reales'
          $huella = (Get-FileHash $testigo).Hash
          $exe = (Get-ChildItem 'instalador/SGF-Escritorio-Setup-*.exe' | Select-Object -First 1).FullName
          $nodo = Join-Path $destino 'servidor/runtime/node.exe'
          Copy-Item (Get-Command node).Source $nodo -Force
          $proceso = Start-Process $nodo -ArgumentList '-e "setInterval(()=>{},1000)"' -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 2
            if ($proceso.HasExited) { throw 'El proceso simulado de la instalación anterior no arrancó.' }
            $bloqueada = Start-Process $exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=""' -Wait -PassThru
            if ($bloqueada.ExitCode -eq 0 -or $proceso.HasExited -or (Get-FileHash $testigo).Hash -ne $huella) { throw 'La actualización debe detenerse sin terminar SGF ni cambiar datos.' }
          } finally { if (-not $proceso.HasExited) { Stop-Process -Id $proceso.Id -Force } }
          $r = Start-Process $exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=""' -Wait -PassThru
          if ($r.ExitCode -ne 0 -or (Get-FileHash $testigo).Hash -ne $huella) { throw 'La actualización no conservó los datos simulados.' }
          $reg = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E2C1A54-6B7D-4C3E-9F11-7A5D2B4C8E90}_is1'
          $info = Get-ItemProperty $reg
          if ($info.DisplayVersion -ne '4.0.10' -or $info.InstallLocation.TrimEnd('\') -ine $destino.TrimEnd('\')) { throw 'La nueva versión no actualizó la instalación anterior.' }
          if (-not (Test-Path (Join-Path $destino 'servicio/gestionar.ps1'))) { throw 'Falta el gestor de servicio.' }
          Write-Host 'Actualización en la misma carpeta, bloqueo de proceso activo y datos ficticios conservados: OK.'

      - name: Comprimir version portable
        shell: pwsh
        run: |
          Compress-Archive -Path 'distribucion/*' -DestinationPath "SGF-Escritorio-Portable-${{ env.VERSION }}.zip" -Force

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: SGF-Escritorio-${{ env.VERSION }}
          path: |
            instalador/SGF-Escritorio-Setup-*.exe
            SGF-Escritorio-Portable-*.zip
          if-no-files-found: error

      # Publicación manual solo después de revisar todas las pruebas.

  # ───────────────────────────────────────────────────────────────────────────
  # Navegador real con datos ficticios: la web servida por el mismo servidor
  # conserva acceso, permisos, temas y el flujo Excel/PDF/estadísticas.
  web:
    name: Navegador · interfaz y facturas
    needs: servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar servidor SQLite de prueba
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npx tsc
      - name: Compilar la interfaz del navegador
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Probar selector y ambas versiones con Chromium
        working-directory: client
        run: |
          node test/seleccionar-version.mjs
          node test/navegador.mjs
          SGF_TEST_COMPAT=1 node test/navegador.mjs
      - name: Probar enlace desde Chromium en red ficticia
        working-directory: client
        run: |
          set -e
          sudo ip addr add 203.0.113.50/32 dev lo
          trap 'sudo ip addr del 203.0.113.50/32 dev lo || true' EXIT
          SGF_RED_CLIENTE_PRUEBA=203.0.113.50 node --no-warnings test/acceso-enlace.mjs
      - name: Preparar Firefox 80 aislado para pruebas con datos ficticios
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libdbus-glib-1-2
          mkdir -p "$RUNNER_TEMP/sgf-firefox80"
          cd "$RUNNER_TEMP/sgf-firefox80"
          curl -fsSL --retry 3 https://archive.mozilla.org/pub/firefox/releases/80.0/linux-x86_64/en-US/firefox-80.0.tar.bz2 -o firefox.tar.bz2
          echo '84191f06dd927cd16b8c0900e6c330f68cc8012bc48e9277891282a2d6f7bce7  firefox.tar.bz2' | sha256sum -c -
          tar xjf firefox.tar.bz2
          curl -fsSL --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.29.1/geckodriver-v0.29.1-linux64.tar.gz -o gecko.tar.gz
          echo 'ec164910a3de7eec71e596bd2a1814ae27ba4c9d112b611680a6470dbe2ce27b  gecko.tar.gz' | sha256sum -c -
          tar xzf gecko.tar.gz
      - name: Probar selección y flujos en Firefox 80
        working-directory: client
        run: |
          export SGF_FIREFOX80="$RUNNER_TEMP/sgf-firefox80/firefox/firefox"
          export SGF_GECKODRIVER="$RUNNER_TEMP/sgf-firefox80/geckodriver"
          node test/firefox80.mjs

  # 3. Pruebas de integracion: la app Flutter habla con el servidor real
  # ───────────────────────────────────────────────────────────────────────────
  integracion:
    name: Integracion · Flutter + servidor
    needs: servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Preparar servidor
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npx tsc
          mkdir -p "$GITHUB_WORKSPACE/datos-ci"
          DB_TYPE=sqlite PORT=3000 HOST=127.0.0.1 \
          JWT_SECRET=secreto-ci-1234567890 \
          SGF_DATA_DIR="$GITHUB_WORKSPACE/datos-ci" \
          SGF_CONSOLE_TOKEN=token-consola-ci-1234567890 \
          node dist/index.js > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Dependencias Flutter
        working-directory: escritorio
        run: flutter pub get

      - name: Pruebas de integracion
        working-directory: escritorio
        env:
          SGF_INTEGRACION: '1'
          SGF_BASE: http://127.0.0.1:3000
          SGF_CONSOLE_TOKEN: token-consola-ci-1234567890
          SGF_CLAVE_PRUEBAS: para-pruebas-123
        run: flutter test test_integracion/api_test.dart --reporter expanded

      - name: Registro si algo falla
        if: failure()
        run: cat server/servidor.log || true
