name: Laboratorio aislado de arranque (Windows)
on:
  push:
    branches: ['laboratorio/inicio-seguro']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratorio:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exclusión entre procesos y terminación forzada
        working-directory: server
        run: node --no-warnings test/laboratorio/exclusion.mjs
      - name: S4U con usuario temporal sin sesión iniciada
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nombre = "SGF-laboratorio-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $id = "sgflab" + $env:GITHUB_RUN_ID.Substring([Math]::Max(0,$env:GITHUB_RUN_ID.Length-8))
          $cuenta = "$env:COMPUTERNAME\$id"
          $carpeta = "C:\sgf-lab-${env:GITHUB_RUN_ID}"
          $estado = Join-Path $carpeta 'estado.json'
          $programa = (Get-Command node).Source
          $script = Join-Path $carpeta 'tarea-s4u.cjs'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start(); $puerto = $listener.LocalEndpoint.Port; $listener.Stop()
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $clave = (ConvertTo-SecureString ([Convert]::ToBase64String($bytes)+'aA1#') -AsPlainText -Force)
          $permisoAnadido = $false
          try {
            $usuarioTemporal = New-LocalUser -Name $id -Password $clave -PasswordNeverExpires
            $sid = $usuarioTemporal.SID.Value
            Add-Type -Path (Join-Path $env:GITHUB_WORKSPACE 'server/test/laboratorio/permiso-lote.cs')
            [PermisoLoteLaboratorio]::Modificar($sid, $true)
            $permisoAnadido = $true
            New-Item -ItemType Directory -Path $carpeta -Force | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'server/test/laboratorio/tarea-s4u.cjs') $script
            & icacls $carpeta /grant "${cuenta}:(OI)(CI)(M)" | Out-Null
            if ($LASTEXITCODE -ne 0) {throw 'No se pudo dar acceso temporal a la carpeta de laboratorio.'}
            $argsTarea = '"{0}" "{1}" {2}' -f $script,$estado,$puerto
            # SOLO LABORATORIO: registrar bajo la identidad temporal, y retirar
            # después su pertenencia administrativa antes de ejecutar la tarea.
            $b64Programa = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($programa))
            $b64Argumentos = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($argsTarea))
            $b64Cuenta = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($cuenta))
            $b64Nombre = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($nombre))
            $rutaError=Join-Path $carpeta 'registro-error.txt'
            $b64Error=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($rutaError))
            $registrar = @'
          $ErrorActionPreference='Stop'
          function dec($s) {[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($s))}
          try {
          $accion=New-ScheduledTaskAction -Execute (dec 'PROGRAMA_B64') -Argument (dec 'ARGUMENTOS_B64')
          $principal=New-ScheduledTaskPrincipal -UserId (dec 'CUENTA_B64') -LogonType S4U -RunLevel Limited
          $gatillo=New-ScheduledTaskTrigger -AtStartup
          $config=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 2) -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName (dec 'NOMBRE_B64') -Action $accion -Principal $principal -Trigger $gatillo -Settings $config | Out-Null
          } catch { $_ | Out-String | Set-Content -LiteralPath (dec 'ERROR_B64'); exit 1 }
          '@
            $registrar=$registrar.Replace('PROGRAMA_B64',$b64Programa).Replace('ARGUMENTOS_B64',$b64Argumentos).Replace('CUENTA_B64',$b64Cuenta).Replace('NOMBRE_B64',$b64Nombre).Replace('ERROR_B64',$b64Error)
            $codigo=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($registrar))
            $powershell=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $grupoAdmin=(Get-LocalGroup -SID 'S-1-5-32-544').Name
            Add-LocalGroupMember -Group $grupoAdmin -Member $cuenta
            $credencial = [System.Management.Automation.PSCredential]::new($cuenta, $clave)
            $registro = Start-Process -FilePath $powershell -Credential $credencial -ArgumentList "-NoProfile -NonInteractive -EncodedCommand $codigo" -WorkingDirectory $carpeta -Wait -PassThru
            Remove-LocalGroupMember -Group $grupoAdmin -Member $cuenta
            if ($registro.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $rutaError) {Get-Content -LiteralPath $rutaError | Write-Host}
              throw "Falló el registro bajo la identidad temporal: $($registro.ExitCode)"
            }
            Start-ScheduledTask -TaskName $nombre
            $limite = (Get-Date).AddSeconds(45)
            while (-not (Test-Path -LiteralPath $estado) -and (Get-Date) -lt $limite) {Start-Sleep -Milliseconds 500}
            if (-not (Test-Path -LiteralPath $estado)) {
              Get-ScheduledTaskInfo -TaskName $nombre | Format-List | Out-String | Write-Host
              throw 'La tarea S4U del usuario temporal no creó el indicador de inicio.'
            }
            $respuesta = Invoke-RestMethod -Uri "http://127.0.0.1:$puerto/prueba" -TimeoutSec 10
            if ($respuesta.servicio -ne 'sgf-laboratorio' -or $respuesta.usuario -ne $id) {throw 'La tarea no respondió con la identidad esperada.'}
            Write-Host 'OK: un usuario temporal sin sesión interactiva ejecutó la tarea S4U y respondió por loopback. Sin reinicio físico.'
          } finally {
            Stop-ScheduledTask -TaskName $nombre -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $nombre -Confirm:$false -ErrorAction SilentlyContinue
            if ($permisoAnadido) { try {[PermisoLoteLaboratorio]::Modificar($sid, $false)} catch {Write-Warning 'No se pudo retirar el derecho temporal.'} }
            Remove-LocalUser -Name $id -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $carpeta -Recurse -Force -ErrorAction SilentlyContinue
          }
