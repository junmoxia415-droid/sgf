name: Servidor · pruebas

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'server/**'
      - '.github/workflows/servidor-pruebas.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  tipos-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Dependencias
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Comprobar tipos
        working-directory: server
        run: npx tsc --noEmit

      - name: Compilar
        working-directory: server
        run: npx tsc

      - name: Red local y permisos con datos ficticios
        working-directory: server
        run: |
          python3 test/red-y-permisos.py
          node test/migracion-permisos.mjs
          node test/nombre-red.mjs
          node test/exclusion-datos.mjs
          node test/pdf-variados-api.mjs

      # Falla si aparece una vulnerabilidad conocida (alta o crítica) en las
      # dependencias del servidor o del cliente. Los paquetes con aviso sin
      # parche quedan fijados por "overrides" en cada package.json.
      - name: Dependencias sin vulnerabilidades conocidas
        run: |
          echo "== servidor =="
          (cd server && npm audit --audit-level=high)
          echo "== cliente =="
          (cd client && npm ci --no-audit --no-fund && npm audit --audit-level=high)

      - name: Buscar secretos en el repositorio
        run: |
          # Nunca debe subirse un .env ni una credencial real escrita en el código.
          # Este paso ya detectó dos fallos reales del proyecto:
          #   - la contraseña de Oracle escrita en launcher/sgf-launcher.py
          #     (ahora se pide en la ventana y se guarda en el .env del equipo);
          #   - la contraseña de fábrica del administrador, igual en todas las
          #     instalaciones (ahora se genera al azar en cada equipo).
          #
          # Solo se considera secreto un valor ESCRITO (entre comillas, o tal cual
          # en un archivo de configuración). Asignar una variable desde otra
          # variable o desde una función NO es un secreto.
          python3 - <<'PY'
          import re, subprocess, sys

          CLAVES = r'(PASSWORD|SECRET|PASSWD|CLAVE|API_KEY|TOKEN)'
          # Archivos donde una clave va suelta, sin comillas: archivos de configuracion.
          CONFIG = ('.env', '.iss', '.bat', '.cmd', '.ps1', '.yml', '.yaml', '.conf', '.ini', '.properties')

          LITERAL = re.compile(CLAVES + r'\s*[=:]\s*["\']([^"\']{8,})["\']', re.I)
          SUELTA = re.compile(r'^\s*' + CLAVES + r'\s*=\s*([^\s"\']{8,})\s*$', re.I)

          # Plantillas que NO son secretos: valores que salen de una variable,
          # marcadores evidentes de prueba, o textos de ayuda.
          PLANTILLA = re.compile(
              r'\$\{|\$[a-z_]|env_entries|process\.env|os\.environ|token_hex|generar|aleatori|'
              r'cambiar-en|secreto-ci|para-pruebas|pruebas123|x{6,}|\*{3,}|<[^>]+>|getItem|prompt',
              re.I,
          )

          archivos = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.split()
          fallos = []

          for ruta in archivos:
              if ruta.startswith('.github/workflows/') or ruta.startswith('node_modules/'):
                  continue
              if ruta.endswith('.env'):
                  fallos.append(f'{ruta}: hay un archivo .env versionado')
                  continue
              es_config = ruta.endswith(CONFIG)
              try:
                  with open(ruta, encoding='utf-8', errors='ignore') as f:
                      lineas = f.readlines()
              except OSError:
                  continue
              for numero, linea in enumerate(lineas, 1):
                  if PLANTILLA.search(linea):
                      continue
                  if LITERAL.search(linea) or (es_config and SUELTA.search(linea)):
                      fallos.append(f'{ruta}:{numero}: {linea.strip()[:110]}')

          if fallos:
              print('ERROR: parece haber credenciales escritas en el codigo:')
              for f in fallos:
                  print('  ' + f)
              sys.exit(1)
          print('Sin secretos visibles.')
          PY

      # Genera datos INVENTADOS (Excel de lineas, oficiales, 3 meses de consumo,
      # facturas PDF de 1 a 120 servicios) y comprueba el flujo completo:
      # importar Excel -> subir 12 facturas -> 2 por mes -> sustituir una ->
      # cruzar factura con Excel -> estadisticas de los 3 meses.
      - name: Prueba completa con datos inventados
        working-directory: server
        env:
          DB_TYPE: sqlite
          JWT_SECRET: secreto-solo-para-pruebas-123456
        run: npx tsx src/scripts/prueba-extremo-a-extremo.ts

      - name: Pruebas del analizador de PDF
        working-directory: server
        env:
          DB_TYPE: sqlite
          JWT_SECRET: secreto-solo-para-pruebas-123456
        run: |
          if [ -f src/scripts/test-parser.ts ]; then
            npx tsx src/scripts/test-parser.ts || echo "Aviso: el script de pruebas del analizador necesita PDFs de ejemplo."
          else
            echo "Sin script de pruebas del analizador."
          fi
